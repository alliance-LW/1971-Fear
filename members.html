<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEMBERS | 1971 FEAR</title>
<style>:root{--bg:#090c0f;--panel:#11171b;--red:#d82929;--gold:#e6ad3d;--text:#f4f2ea;--muted:#9ca7ad;--line:#293238}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#0a0e11,#07090b);color:var(--text);font-family:Arial,sans-serif}.wrap{width:min(1100px,92%);margin:auto}nav{border-bottom:1px solid var(--line);background:#090c0ff2}.nav{min-height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:24px;font-weight:900}.brand b{color:var(--red)}nav a{color:#ddd;text-decoration:none;font-weight:800}header{padding:70px 0 35px}.kicker{color:var(--gold);font-weight:900;letter-spacing:2px;font-size:12px}h1{font-size:clamp(46px,8vw,80px);margin:8px 0}.lead{color:#c0c7ca;line-height:1.7}.panel{max-width:520px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--red);padding:28px;margin:15px 0 60px}.field{margin:15px 0}label{display:block;font-size:12px;font-weight:900;color:var(--gold);margin-bottom:7px}input{width:100%;padding:13px;background:#080b0d;border:1px solid #3a454b;color:#fff;border-radius:4px;font-size:16px}.btn{border:0;background:var(--red);color:white;padding:13px 18px;font-weight:900;cursor:pointer;border-radius:4px}.error{color:#ff9b9b;margin-top:14px}.member{display:none}.card{background:var(--panel);border:1px solid var(--line);padding:24px;margin:16px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:#0b0f12;padding:16px;border:1px solid var(--line)}.stat b{display:block;color:var(--gold);font-size:22px}.muted{color:var(--muted)}@media(max-width:650px){.stats{grid-template-columns:1fr}}</style></head>
<body><nav><div class="wrap nav"><div class="brand">1971 • <b>FEAR</b></div><a href="index.html">HOME</a></div></nav>
<header><div class="wrap"><div class="kicker">SERVER 1971 • FEAR</div><h1>MEMBERS</h1><p class="lead">Member access uses your current Last War commander name from the FEAR roster.</p></div></header>
<main class="wrap"><section id="login" class="panel"><h2>Member Login</h2><form id="loginForm"><div class="field"><label for="user">COMMANDER NAME</label><input id="user" autocomplete="username" required></div><div class="field"><label for="pass">PASSWORD</label><input id="pass" type="password" autocomplete="current-password" required></div><button class="btn">LOGIN</button><div id="msg" class="error"></div></form></section>
<section id="member" class="member"><div class="card"><div class="kicker">MEMBER VERIFIED</div><h2 id="welcome">Welcome</h2><p class="muted">Your commander name is on the current FEAR member list synchronized from FarmOps.</p><div class="stats"><div class="stat"><span>Commander</span><b id="memberName"></b></div><div class="stat"><span>Alliance</span><b>FEAR</b></div><div class="stat"><span>Server</span><b>1971</b></div></div><div id="farmDash"></div><p><button class="btn" id="logout">LOG OUT</button></p></div></section></main>
<script>
let roster=[];
async function loadRoster(){try{const r=await fetch("data/members.json?ts="+Date.now(),{cache:"no-store"});if(!r.ok)throw 0;const d=await r.json();roster=(d.members||[]).map(x=>String(x.name||x));}catch(e){document.getElementById("msg").textContent="Member list is temporarily unavailable.";}}
function norm(s){return String(s||"").trim().toLocaleLowerCase();}
document.getElementById("loginForm").addEventListener("submit",e=>{e.preventDefault();const u=document.getElementById("user").value.trim(),p=document.getElementById("pass").value;const match=roster.find(n=>norm(n)===norm(u));if(match&&p==="1971fear"){sessionStorage.setItem("fearMember",match);show(match);}else document.getElementById("msg").textContent="Commander name or password is incorrect.";});
function show(name){document.getElementById("login").style.display="none";document.getElementById("member").style.display="block";document.getElementById("welcome").textContent="Welcome, "+name;document.getElementById("memberName").textContent=name;loadStats(name);}
async function loadStats(name){try{const r=await fetch("data/train-results.json?ts="+Date.now(),{cache:"no-store"});if(!r.ok)return;const d=await r.json();const row=(d.audit||[]).find(x=>norm(x.name)===norm(name));if(!row)return;const el=document.getElementById("farmDash");el.innerHTML='<div class="card"><div class="kicker">FARMOPS DASHBOARD</div><h2>Weekly Stats</h2><div class="stats"><div class="stat"><span>VS Points</span><b>'+Number(row.vs||0).toLocaleString()+'</b></div><div class="stat"><span>Tech Donations</span><b>'+Number(row.donations||0).toLocaleString()+'</b></div><div class="stat"><span>Train Status</span><b>'+row.status+'</b></div></div><p class="muted">FarmOps week: '+(d.week||"Current")+'</p></div>';}catch(e){}}
document.getElementById("logout").onclick=()=>{sessionStorage.removeItem("fearMember");location.reload();};const saved=sessionStorage.getItem("fearMember");if(saved)show(saved);loadRoster();
</script></body></html>
