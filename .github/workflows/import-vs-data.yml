name: Import VS Data

on:
  push:
    paths:
      - "data/vs-import-*.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-vs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Import VS scores to FarmOps
        env:
          FARMOPS_API_KEY: ${{ secrets.FARMOPS_API_KEY }}
        run: |
          node <<'NODE'
          const fs = require("fs");
          const path = "data/vs-import-2026-10-06.json";
          const payload = JSON.parse(fs.readFileSync(path, "utf8"));
          (async () => {
            const r = await fetch("https://www.lastwar.farm/api/v1/alliance/members/duels", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${process.env.FARMOPS_API_KEY}`,
                "Content-Type": "application/json",
                Accept: "application/json"
              },
              body: JSON.stringify(payload)
            });
            const text = await r.text();
            console.log("FarmOps status:", r.status);
            console.log(text);
            if (!r.ok) process.exit(1);
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Refresh 1971 member dashboard
        env:
          FARMOPS_API_KEY: ${{ secrets.FARMOPS_API_KEY }}
        run: node scripts/generate-train.js --members-only
      - name: Commit refreshed member data
        run: |
          git config user.name "FEAR Member Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/members.json data/member-dashboard.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh members after VS import 2026-10-06"
          git push
