name: Nightly Member Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Refresh members from FarmOps
        env:
          FARMOPS_API_KEY: ${{ secrets.FARMOPS_API_KEY }}
        run: node scripts/generate-train.js --members-only
      - name: Commit member data
        run: |
          git config user.name "FEAR Member Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/members.json data/member-dashboard.json
          git diff --cached --quiet && exit 0
          git commit -m "Nightly FEAR member refresh"
          git push
