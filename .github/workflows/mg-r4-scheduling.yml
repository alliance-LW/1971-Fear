name: FEAR R4 MG Scheduling (separate)
on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Send a test R4 scheduling alert (does not create an issue)'
        type: boolean
        default: false
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: read
  issues: write
concurrency:
  group: fear-r4-mg-scheduler
  cancel-in-progress: false
jobs:
  schedule-mg:
    runs-on: ubuntu-latest
    env:
      MG_DISCORD_WEBHOOK_URL: ${{ secrets.MG_DISCORD_WEBHOOK_URL }}
      MG_R4_ROLE_ID: ${{ vars.MG_R4_ROLE_ID }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      TEST_MODE: ${{ inputs.test || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check cooldown, conflicts, and alert R4
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, datetime as dt, urllib.request, urllib.error, sys
          UTC=dt.timezone.utc
          now=dt.datetime.now(UTC)
          cfg=json.load(open('config/mg-r4-schedule.json',encoding='utf-8'))
          test=os.getenv('TEST_MODE','false').lower()=='true'
          def parse(s):
              return dt.datetime.fromisoformat(s.replace('Z','+00:00')).astimezone(UTC)
          def api(path, method='GET', data=None):
              body=json.dumps(data).encode() if data is not None else None
              req=urllib.request.Request('https://api.github.com'+path,data=body,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'FEAR-MG-R4'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.load(r)
          if not test:
              if not cfg.get('enabled'):
                  print('R4 MG scheduling disabled until cooldown and events verified.');sys.exit(0)
              if cfg.get('phase')=='phase_1_test':
                  last_end=cfg.get('last_mg_end_utc')
                  if not last_end:
                      print('Phase 1 test: waiting for verified last_mg_end_utc; no automatic alert.');sys.exit(0)
                  end=parse(last_end)
                  if now<=end:
                      print('Phase 1 test: MG end is not in the past.');sys.exit(0)
                  offset_minutes=int(cfg['server_utc_offset_minutes'])
                  offset_local=dt.timedelta(minutes=offset_minutes)
                  end_server=end+offset_local
                  next_reset_server=end_server.replace(hour=0,minute=0,second=0,microsecond=0)+dt.timedelta(days=1)
                  unlock=next_reset_server-offset_local
                  if now<unlock:
                      print('Phase 1 test: waiting for first reset after MG ends:',unlock.isoformat());sys.exit(0)
                  if now>=unlock+dt.timedelta(hours=1):
                      print('Phase 1 test: reset alert window expired; no stale alert.');sys.exit(0)
              else:
                  if not cfg.get('cooldown_unlock_utc') or not cfg.get('rotation_id'):
                      print('Missing verified unlock timestamp or rotation ID; no alert.');sys.exit(0)
                  unlock=parse(cfg['cooldown_unlock_utc'])
                  if now<unlock:
                      print('Cooldown active until',unlock.isoformat());sys.exit(0)
          else:
              unlock=now
          offset=dt.timedelta(minutes=int(cfg['server_utc_offset_minutes']))
          hh,mm=map(int,cfg['preferred_start_server_time'].split(':'))
          server_now=now+offset
          base=server_now.replace(hour=hh,minute=mm,second=0,microsecond=0)
          if base<server_now+dt.timedelta(minutes=int(cfg['lead_minutes'])):
              base+=dt.timedelta(days=1)
          duration=dt.timedelta(minutes=int(cfg['mg_duration_minutes']))
          events=[]
          for e in cfg.get('events',[]):
              events.append((parse(e['start_utc'])-dt.timedelta(minutes=int(e.get('buffer_before_minutes',0))),parse(e['end_utc'])+dt.timedelta(minutes=int(e.get('buffer_after_minutes',0))),e['name']))
          # Expand confirmed weekly events using the Last War server clock.
          weekdays={'Monday':0,'Tuesday':1,'Wednesday':2,'Thursday':3,'Friday':4,'Saturday':5,'Sunday':6}
          for e in cfg.get('recurring_events',[]):
              day=weekdays[e['weekday']]
              hour,minute=map(int,e['start_server_time'].split(':'))
              for days_ahead in range(-1,int(cfg['search_days'])+2):
                  date=(now+offset+dt.timedelta(days=days_ahead)).date()
                  if date.weekday()!=day:
                      continue
                  local=dt.datetime.combine(date,dt.time(hour,minute),tzinfo=UTC)
                  start=local-offset
                  end=start+dt.timedelta(minutes=int(e['duration_minutes']))
                  events.append((start-dt.timedelta(minutes=int(e.get('buffer_before_minutes',0))),end+dt.timedelta(minutes=int(e.get('buffer_after_minutes',0))),e['name']))
          if cfg.get('unconfirmed_events'):
              print('WARNING: Unconfirmed event schedules:', ', '.join(cfg['unconfirmed_events']))
              if not test and cfg.get('phase')!='phase_1_test':
                  print('No conflict-free recommendation until event coverage is verified.')
                  sys.exit(0)
          # Balanced policy: hard-block confirmed conflicts, then rank safe candidates.
          policy=cfg.get('scheduling_policy',{})
          max_wait=dt.timedelta(hours=float(policy.get('max_wait_hours',12)))
          step=int(cfg['candidate_step_minutes'])
          candidates=[]
          for n in range(int(cfg['search_days'])*24*60//step):
              candidate=(base-offset)+dt.timedelta(minutes=n*step)
              if candidate>base-offset+max_wait:
                  break
              if any(candidate<b and candidate+duration>a for a,b,_ in events):
                  continue
              candidates.append(candidate)
          if not candidates:
              print('No conflict-free slot in balanced search window; R4 review required.');sys.exit(0)
          # Participation scores are optional, explicitly entered windows (0-100).
          # Never infer turnout from unknown or missing member data.
          windows=[]
          for w in cfg.get('participation_windows',[]):
              try:
                  windows.append((parse(w['start_utc']),parse(w['end_utc']),max(0,min(100,float(w['expected_percent'])))))
              except (KeyError,TypeError,ValueError):
                  print('Skipping invalid participation window')
          def turnout(c):
              matches=[pct for a,b,pct in windows if c>=a and c+duration<=b]
              return max(matches) if matches else None
          available=any(turnout(c) is not None for c in candidates)
          earliest=candidates[0]
          if available:
              def score(c):
                  wait=(c-earliest).total_seconds()/3600
                  early=max(0,1-wait/max(float(policy.get('max_wait_hours',12)),0.01))
                  part=turnout(c)
                  # Missing estimates receive no invented score.
                  participation=(part/100) if part is not None else 0
                  server_c=c+offset
                  preferred=server_c.replace(hour=hh,minute=mm,second=0,microsecond=0)
                  proximity=abs((server_c-preferred).total_seconds())/3600
                  preferred_score=max(0,1-proximity/12)
                  return (float(policy.get('earliest_weight',.5))*early+
                          float(policy.get('participation_weight',.35))*participation+
                          float(policy.get('preferred_time_weight',.15))*preferred_score)
              chosen=max(candidates,key=lambda c:(score(c),-c.timestamp()))
          else:
              chosen=earliest
              print('Participation data missing: choosing earliest conflict-free candidate, not claiming turnout optimization.')
          print('Balanced MG candidate:',chosen.isoformat(),'participation estimate:',turnout(chosen))
          role=os.getenv('MG_R4_ROLE_ID','').strip()
          if not role.isdigit():
              print('Set MG_R4_ROLE_ID repository variable to numeric Discord role ID.');sys.exit(1)
          webhook=os.getenv('MG_DISCORD_WEBHOOK_URL','').strip()
          if not webhook:
              print('Missing MG_DISCORD_WEBHOOK_URL secret.');sys.exit(1)
          from urllib.parse import urlsplit
          parsed_webhook=urlsplit(webhook)
          if parsed_webhook.scheme!='https' or parsed_webhook.hostname not in ('discord.com','discordapp.com') or not parsed_webhook.path.startswith('/api/webhooks/') or len(parsed_webhook.path.split('/'))<5:
              print('INVALID WEBHOOK URL: MG_DISCORD_WEBHOOK_URL must be the full Discord Copy Webhook URL (https://discord.com/api/webhooks/ID/TOKEN). Never paste the token alone.');sys.exit(1)
          rotation='MANUAL-TEST' if test else ('PHASE1-'+unlock.strftime('%Y-%m-%dT%H:%MZ') if cfg.get('phase')=='phase_1_test' else str(cfg['rotation_id']))
          title='MG R4 scheduling: '+rotation
          if not test:
              import urllib.parse
              query=urllib.parse.quote('repo:'+os.environ['REPO']+' in:title "'+title+'"')
              found=api('/search/issues?q='+query)
              if any(item['title']==title for item in found.get('items',[])):
                  print('Already alerted this rotation; no duplicate.');sys.exit(0)
          server_time=chosen+offset
          phase1=cfg.get('phase')=='phase_1_test'
          message=('<@&'+role+'> **1971 FEAR — MG SCHEDULING '+('MANUAL TEST' if test else 'PHASE 1 TEST' if phase1 else 'OPEN')+'**\n'
                   +('First server reset after recorded MG end reached (00:00 server time). Check in-game scheduling availability; this is a test alert, not proof MG is unlocked.\n' if phase1 else 'Cooldown unlock: '+unlock.strftime('%Y-%m-%d %H:%M UTC')+'\n')
                   +('Tentative MG slot: ' if phase1 else 'Recommended MG: ')+server_time.strftime('%a %Y-%m-%d %H:%M')+' server time '
                   +'('+chosen.strftime('%Y-%m-%d %H:%M UTC')+')\n'
                   +('INCOMPLETE CONFLICT CHECK: Winter Storm, Capital War and Zombie Siege times are unknown. Do not confirm MG without manual verification.\n' if phase1 else 'Checked against '+str(len(events))+' configured event windows.\n')
                   +('Participation: '+(str(round(turnout(chosen)))+'% estimated from entered availability windows.\\n' if turnout(chosen) is not None else 'Participation not verified; earliest conflict-free fallback.\\n'))
                   +'R4: verify scheduling in-game and confirm manually.')
          payload=json.dumps({'username':'FEAR R4 MG Scheduler','content':message,'allowed_mentions':{'parse':[],'roles':[role]}}).encode()
          req=urllib.request.Request(webhook+('&' if '?' in webhook else '?')+'wait=true',data=payload,method='POST',headers={'Content-Type':'application/json','User-Agent':'FEAR-R4-MG-Scheduler'})
          with urllib.request.urlopen(req,timeout=20) as response:
              print('Discord accepted R4 alert:',json.load(response).get('id'))
          if not test:
              api('/repos/'+os.environ['REPO']+'/issues',method='POST',data={'title':title,'body':'R4 scheduling alert sent. Recommended MG start: '+server_time.isoformat()+' (server clock). Close when scheduled in-game. Do not reuse rotation_id.'})
          PY
