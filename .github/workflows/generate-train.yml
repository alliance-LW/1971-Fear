name: Generate Train Roster

on:
  workflow_dispatch:
  schedule:
    # Last War server reset: Saturday 9:00 PM Central = Sunday 02:00 UTC during CDT.
    - cron: "5 2 * * 0"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate proposed Train selections
        env:
          FARMOPS_API_KEY: ${{ secrets.FARMOPS_API_KEY }}
        run: node scripts/generate-train.js

      - name: Commit generated results
        run: |
          git config user.name "FEAR Train Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/train-results.json data/train-7-day.json data/members.json
          git diff --cached --quiet && exit 0
          git commit -m "Generate proposed FEAR Train roster"
          git push
